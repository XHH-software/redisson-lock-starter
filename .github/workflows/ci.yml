name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (JDK 11, Redis via Testcontainers)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # GitHub 的 ubuntu runner 自带 Docker，Testcontainers 会真实拉起 redis:7.4-alpine，
      # 所以集成测试在 CI 上是实际执行的，而不是被跳过。
      - name: Build and run all tests
        run: mvn -B verify

      # 关键一步：断言集成测试真的执行了。
      # 因为测试类上有 @Testcontainers(disabledWithoutDocker = true)，
      # 一旦 runner 上没有 Docker，surefire 会把整个类标记为 Skipped，构建依然是绿的。
      # 那样 green check 就成了假证据，所以这里把它变成硬性失败。
      - name: Assert integration tests really ran
        run: |
          set -e
          report="target/surefire-reports/com.xhh.lock.test.LockAspectIntegrationTest.txt"
          if [ ! -f "$report" ]; then
            echo "::error::未找到集成测试报告 $report，测试类可能根本没被扫描到"
            exit 1
          fi
          echo "---------- $report ----------"
          cat "$report"
          echo "-----------------------------"
          if grep -q "Skipped: 1" "$report" || ! grep -q "Tests run: 6, Failures: 0, Errors: 0, Skipped: 0" "$report"; then
            echo "::error::集成测试被跳过或未全部通过 —— 通常是 runner 上没有 Docker，green check 不可信"
            exit 1
          fi
          echo "OK: 6 个集成用例全部真实执行，无跳过"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
